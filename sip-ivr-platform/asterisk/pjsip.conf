; PJSIP trunk template — edit for your ITSP (client caller ID from provider).

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[trunk-auth]
type=auth
auth_type=userpass
username=YOUR_SIP_USERNAME
password=YOUR_SIP_PASSWORD

[trunk-aor]
type=aor
contact=sip:sip.example.com:5060
qualify_frequency=60

[trunk-reg]
type=registration
transport=transport-udp
outbound_auth=trunk-auth
server_uri=sip:sip.example.com
client_uri=sip:YOUR_SIP_USERNAME@sip.example.com
retry_interval=60

[trunk]
type=endpoint
transport=transport-udp
context=from-trunk
disallow=all
allow=ulaw,alaw
outbound_auth=trunk-auth
aors=trunk-aor
from_user=YOUR_SIP_USERNAME
from_domain=sip.example.com

[trunk-identify]
type=identify
endpoint=trunk
match=sip.example.com
