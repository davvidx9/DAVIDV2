[general]
static=yes
writeprotect=no

[globals]

; Outbound: ARI originate enters here then Stasis
[from-ivr-platform]
exten => s,1,NoOp(IVR Platform outbound)
 same => n,Stasis(ivr-platform,${ARG1})

; Inbound from SIP trunk
[from-trunk]
exten => _X.,1,NoOp(Inbound ${CALLERID(num)})
 same => n,Stasis(ivr-platform,inbound)

; Optional: local test extension
[local-test]
exten => 1000,1,Answer()
 same => n,Stasis(ivr-platform,test)
